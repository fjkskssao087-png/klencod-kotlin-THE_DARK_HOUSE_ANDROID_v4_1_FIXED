<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>THE DARK HOUSE</title><link rel="stylesheet" href="style.css"><script src="https://cdn.babylonjs.com/babylon.js"></script></head><body><canvas id="renderCanvas"></canvas><div id="vignette"></div><div id="hud"><div class="topline"><b>THE DARK HOUSE</b><span id="objective">استكشف المنزل • الكشاف يعمل</span></div><div id="hint">تحرك نحو الباب أمامك</div><button id="quickSettings" class="gear">⚙</button><div class="controls"><div id="stick"><i id="knob"></i></div><small>اسحب يمين الشاشة للنظر</small><button id="interact">تفاعل</button><button id="run">ركض</button></div></div><div id="menu" class="screen"><section><small>SURVIVE THE NIGHT</small><h1>THE DARK<br><em>HOUSE</em></h1><p>استيقظت على صوت غريب… والبيت ليس كما تتذكره.</p><button id="start">ابدأ الاستكشاف</button><button id="settingsOpen" class="alt">الإعدادات</button></section></div><div id="settings" class="screen hide"><section class="settingsCard"><small>GAME CONFIGURATION</small><h2>إعدادات اللعبة</h2>
<label>جودة الرسومات<select id="quality"><option value="low">اقتصادية</option><option value="medium" selected>متوسطة</option><option value="high">عالية</option></select></label>
<label>حد الإطارات<select id="fps"><option value="30">30 FPS</option><option value="45">45 FPS</option><option value="60" selected>60 FPS</option></select></label>
<label>حساسية النظر<input id="sensitivity" type="range" min="1" max="10" value="5"></label>
<label>سطوع الصورة<input id="brightness" type="range" min="1" max="10" value="6"></label>
<label>مستوى الصوت<input id="volume" type="range" min="0" max="10" value="5"></label>
<button id="lampToggle" class="alt">تشغيل / إطفاء لمبة السقف</button><button id="flashToggle" class="alt">تشغيل / إطفاء الكشاف</button>
<button id="settingsClose">حفظ والعودة</button></section></div><script src="game.js"></script></body></html>
